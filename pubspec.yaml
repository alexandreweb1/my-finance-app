name: my_finance_app
description: Personal finance management app with Clean Architecture.
publish_to: 'none'

version: 1.1.9+170

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Internationalisation
  intl: ^0.20.2

  # Localizations
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2

  # In-App Purchases (Google Play + App Store)
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

  # Local Notifications (notification-to-transaction feature + bill reminders)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Receive shared text (iOS Share Extension + Android share sheet → transaction)
  receive_sharing_intent: ^1.8.1

  # Home-screen quick action (long-press app icon → "Novo lançamento")
  quick_actions: ^1.0.7

  # App update check
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  in_app_update: ^4.2.3

  # Store review prompt (App Store / Google Play)
  in_app_review: ^2.0.12

  # App lock (PIN + biometrics)
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Import / Export (OFX, CSV → Excel, PDF)
  file_picker: ^8.1.2
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^10.0.0
  xml: ^6.5.0
  path_provider: ^2.1.4

  # HTTP (exchange-rate quotes for currency conversion)
  http: ^1.2.2

  # Receipt attachments (photo/PDF)
  firebase_storage: ^12.3.0
  image_picker: ^1.1.2

  # Callable Cloud Functions (workspace sharing accept/leave)
  cloud_functions: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.4.3
  flutter_launcher_icons: ^0.14.3

# ─── Launcher Icons ────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1E88E5"
    theme_color: "#0D47A1"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48

# ─── Flutter ───────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
